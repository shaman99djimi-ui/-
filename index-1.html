<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>С Днём учителя! Нашим лучшим педагогам</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Rubik:ital,wght@0,500;0,800;1,500&display=swap">
<style>
:root{--bg:#2438ff;--fg:#fff4e0;--paper:#fff4e0;--ink:#1b1033;
--mono:'Rubik Mono One','Arial Black',Impact,sans-serif;--sans:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.5;overflow-x:hidden;transition:background-color .8s,color .8s}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 70% 55% at 50% 30%,rgba(255,255,255,.28),transparent 70%),radial-gradient(ellipse 120% 100% at 50% 50%,transparent 55%,rgba(0,0,0,.35))}
main,header,footer{position:relative;z-index:1}
#prog{position:fixed;z-index:5;top:env(safe-area-inset-top,0px);left:0;height:6px;width:0;background:var(--paper)}
.hero{height:100svh;min-height:520px;overflow:hidden}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero p{position:absolute;left:0;right:0;bottom:max(26px,env(safe-area-inset-bottom,0px));margin:0;padding:0 20px;text-align:center;font-weight:500;font-size:clamp(15px,2.4vw,20px);pointer-events:none}
.hero p b{display:block;font-weight:800;margin-top:6px;animation:nudge 1.6s ease-in-out infinite}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ch{min-height:100svh;display:grid;grid-template-columns:1fr;align-content:center;justify-items:center;gap:clamp(22px,4vw,56px);padding:clamp(48px,8vw,90px) clamp(18px,5vw,64px);max-width:1180px;margin:0 auto}
.fr{--r:-2deg;width:min(72vw,calc(44svh * .8),400px);aspect-ratio:4/5;border-radius:999px 999px 26px 26px;border:5px solid var(--paper);box-shadow:10px 10px 0 var(--ink);overflow:hidden;background:var(--ink);transform:translateY(60px) rotate(calc(var(--r) * 3)) scale(.85);opacity:0;transition:transform .9s cubic-bezier(.2,1.3,.4,1),opacity .6s}
.ch.in .fr{transform:rotate(var(--r));opacity:1}
.fr img{width:100%;height:100%;object-fit:cover;display:block}
.tx{max-width:34rem;text-align:center}
.tx h2{font:clamp(24px,4.4vw,50px)/1.1 var(--mono);margin:0 0 10px}
.role{margin:0 0 18px;font-weight:800;font-size:clamp(15px,2vw,19px)}
.wish{margin:0 0 20px;font-size:clamp(16px,2vw,20px);font-weight:500}
.song{margin:0 auto;padding:4px 0 4px 16px;border-left:5px solid currentColor;text-align:left;font-style:italic;font-weight:500;font-size:clamp(15px,1.9vw,18px);max-width:30ch}
@media(min-width:860px){.ch{grid-template-columns:auto 1fr;justify-items:start}.ch:nth-child(even) .fr{order:2}.tx{text-align:left}.fr{--r:2deg}.ch:nth-child(even) .fr{--r:-2deg}.song{margin:0}.ch:nth-child(even){grid-template-columns:1fr auto}.ch:nth-child(even) .tx{justify-self:end}}
.fin{min-height:100svh;display:grid;place-content:center;justify-items:center;text-align:center;gap:28px;padding:70px 20px}
.fin h2{font:clamp(26px,5.4vw,64px)/1.1 var(--mono);margin:0;max-width:16ch}
.wall{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(6px,1.4vw,12px);max-width:720px}
.wall a{width:clamp(48px,11vw,84px);aspect-ratio:1;border-radius:50%;border:3px solid var(--paper);overflow:hidden;display:block;transition:transform .2s}
.wall a:hover{transform:scale(1.18) rotate(-6deg)}.wall img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.btn{font:800 19px var(--sans);cursor:pointer;border:0;background:var(--paper);color:var(--ink);padding:18px 38px;border-radius:999px;box-shadow:6px 6px 0 var(--ink);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}.btn:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
.btn:focus-visible,.wall a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
footer{text-align:center;padding:0 20px 60px;font-weight:800}
#fw{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
@keyframes nudge{50%{transform:translateY(6px)}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.fr{transition:none;transform:rotate(var(--r));opacity:1}.hero p b{animation:none}body{transition:none}}
</style>
</head>
<body>
<div id="prog"></div>
<header class="hero" data-c="#2438ff,#fff4e0">
  <canvas id="sky" aria-hidden="true"></canvas>
  <h1 class="sr">С Днём учителя! Спасибо вам!</h1>
  <p>Нашим лучшим педагогам от тех, кого вы учите<b>листайте вниз ↓</b></p>
</header>
<main id="m"></main>
<section class="fin" id="fin" data-c="#ffb800,#1b1033">
  <h2>Лучший в мире центр, потому что в нём есть вы!</h2>
  <div class="wall" id="wall"></div>
  <button class="btn" id="boom" type="button">Запустить салют</button>
</section>
<footer data-c="#ffb800,#1b1033">С Днём учителя! Ваши ученики и воспитанники центра молодёжи</footer>
<canvas id="fw" aria-hidden="true"></canvas>

{i:13,n:'Екатерина Андреевна',r:'Лучший педагог клуба операторов БПЛА',c:'#006d77,#fff4e0',w:'Спасибо за точность, смелость и веру в то, что всё получится. С вами любая высота нам по плечу.',s:['Клуб операторов БПЛА, вы лучшие:','Вам покоряется любая высота!']},

{i:8,n:'Сергей Дмитриевич',r:'Лучший педагог по шахматам',c:'#1f6feb,#fff4e0',w:'Вы научили нас думать на несколько ходов вперёд и не сдаваться, когда трудно. Всегда выигрышных партий!',s:['Сергей Дмитриевич: шах и мат, и снова','Шахматный ум нас к победе ведёт!']},

var fc=document.getElementById('fw'),fx=fc.getContext('2d'),S=[],run=false,fcl=['#fff4e0','#ffb800','#ff2d55','#00b7e0','#7dffc4'];
function fz(){fc.width=innerWidth;fc.height=innerHeight}fz();addEventListener('resize',fz);
function burst(x,y){var c=fcl[Math.random()*5|0];for(var k=0;k<64;k++){var a=Math.random()*6.283,v=1+Math.random()*5;S.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:k%3?c:'#fff4e0'})}}
function lp(){fx.clearRect(0,0,fc.width,fc.height);for(var k=S.length-1;k>=0;k--){var s=S[k];s.x+=s.vx;s.y+=s.vy;s.vy+=.05;s.vx*=.985;s.l-=.012;if(s.l<=0){S.splice(k,1);continue}fx.globalAlpha=s.l;fx.fillStyle=s.c;fx.beginPath();fx.arc(s.x,s.y,2.2,0,6.283);fx.fill()}
 if(S.length)requestAnimationFrame(lp);else run=false}
function fire(){var n=0,t=setInterval(function(){burst(fc.width*(.15+Math.random()*.7),fc.height*(.12+Math.random()*.45));if(!run){run=true;requestAnimationFrame(lp)}if(++n>9)clearInterval(t)},260)}
document.getElementById('boom').addEventListener('click',fire);


})();
</script>
